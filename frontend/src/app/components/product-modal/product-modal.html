<div class="modal-container">
  <form (ngSubmit)="onSubmit()" class="modal-form">
    
    <label for="name">Nome do produto</label>
    <input placeholder="Nome" [(ngModel)]="product.name" name="name">

    <label for="description">Descrição</label>
    <input placeholder="Descrição" type="text" [(ngModel)]="product.description" name="description">

    <label for="quantity">Quantidade</label>
    <input placeholder="Quantidade" type="number" [(ngModel)]="product.quantity" name="quantity">

    <label for="price">Preço</label>
    <input placeholder="Preço" type="number" [(ngModel)]="product.price" name="price">

    <div class="btn-container">
      <input type="submit" value="Enviar" class="btn-submit">
    </div>

  </form>
</div>
