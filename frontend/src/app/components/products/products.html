<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let product of products">
            <td>{{ product.id }}</td>
            <td>{{ product.name}}</td>
            <td>{{ product.price}}</td>
            <td>{{ product.value}}</td>
        </tr>
    </tbody>
</table>
